<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{{ page.title | default: site.title | escape }} | Neelesh Reddi</title>
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Neelesh Reddi, home"><span class="brand-mark">NR</span><span>Neelesh Reddi</span></a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}">About</a>
          <a href="{{ '/projects/' | relative_url }}">Projects</a>
          <a href="{{ '/blog/' | relative_url }}">Writing</a>
          <a class="nav-email" href="mailto:reddi.neelesh@gmail.com">Email</a>
          <a class="nav-github" href="https://github.com/nreddi2/data-science-portfolio">GitHub ↗</a>
        </nav>
      </div>
    </header>
    <main id="main" class="shell {{ page.page_class | default: 'content-page' }}">{{ content }}</main>
    <footer class="site-footer">
      <div class="shell footer-inner">
        <span>© {{ 'now' | date: '%Y' }} Neelesh Reddi</span>
        <div><a href="mailto:reddi.neelesh@gmail.com">Email</a><a href="https://github.com/nreddi2/data-science-portfolio">Repository</a><a href="https://www.linkedin.com/in/neelesh-reddi-b532b234b/">LinkedIn</a></div>
      </div>
    </footer>
  </body>
</html>
